[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "naviernet-studio"
version = "0.1.0"
description = "The post-processing studio's data service: evaluates a trained naviernet run on demand"
requires-python = ">=3.10"
dependencies = [
    "naviernet",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "contourpy>=1.0",
    "pillow>=10.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
naviernet-studio = "naviernet_studio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
