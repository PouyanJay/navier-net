# 3M Fluorinert FC-77, saturated at T_sat = 97 C, 1 atm.
# Source: 3M Fluorinert FC-77 product datasheet; saturated liquid transport
# properties (mu, sigma, rho) are temperature-corrected to T_sat from the 25 C
# datasheet nominal values, cross-checked against Mudawar et al.
# NOTE: property values are a first-pass sourcing and should be reviewed against a
# primary reference before production use (see PR).

defaults:
  - base_fluid

name: FC-77

T_sat_C: 97.0 # boiling point at 1 atm

rho_l: 1600.0 # kg/m^3  (saturated liquid)
rho_v: 13.9

mu_l: 5.0e-4 # Pa.s
mu_v: 1.2e-5

k_l: 0.057 # W/m/K
k_v: 0.013

cp_l: 1130.0 # J/kg/K
cp_v: 895.0

sigma: 8.0e-3 # N/m
h_lv: 89.0e3 # J/kg  (latent heat at the boiling point)

molar_mass: 0.415 # kg/mol (3M datasheet; FC-77 is a mixture, average MW)

# Wetting: perfectly wetting dielectric BY CLASS -- no published contact-angle
# or evaporating-angle measurement exists for FC-77. The law below is FC-72's
# (Raj et al. 2012), transferred across the perfluorocarbon wetting class.
# Every run using it is labeled wetting_source: extrapolated in its outputs.
theta_e_deg: 0.5 # class value; unmeasured for this fluid
theta_adv_deg: 0.5
theta_rec_deg: 0.0
theta_ev_coeff: 9.37 # FC-72's fit, class-extrapolated
theta_ev_exp: 0.54
wetting_source: extrapolated
