# Water, saturated at T_sat = 100 C, 1 atm.
# Source: IAPWS-IF97 / Incropera, Fundamentals of Heat and Mass Transfer,
# saturated-water tables at 373.15 K. A high-sigma, high-h_lv contrast case
# against the dielectric fluorocarbons.

defaults:
  - base_fluid

name: Water

T_sat_C: 100.0 # saturation at 1 atm

rho_l: 958.4 # kg/m^3
rho_v: 0.5982

mu_l: 2.82e-4 # Pa.s
mu_v: 1.23e-5

k_l: 0.679 # W/m/K
k_v: 0.0251

cp_l: 4217.0 # J/kg/K
cp_v: 2080.0

sigma: 5.89e-2 # N/m
h_lv: 2.257e6 # J/kg

molar_mass: 0.018015 # kg/mol

# Wetting: PARTIALLY wetting and substrate-dependent -- a different REGIME
# from the dielectrics, not a parameter change. No evaporating-angle power law
# exists; the closure is the hysteresis window itself. The values below sit
# mid-span of the pairs in published flow-boiling force balances (theta_adv
# 45-90.6 deg, theta_rec 8-36 deg: Klausner et al., IJHMT 36:651, 1993 fits;
# Sugrue & Buongiorno measurements) -- the REAL heater's values are UNMEASURED,
# and any conclusion drawn from these must say so (wetting_source below).
theta_e_deg: 45.0
theta_adv_deg: 68.0
theta_rec_deg: 22.0
theta_ev_coeff: null
theta_ev_exp: null
wetting_source: hysteresis
