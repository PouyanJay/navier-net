# 3M Novec 649 (FK-5-1-12, C6F12O), saturated at T_sat = 49 C, 1 atm.
# Source: 3M Novec 649 product datasheet; saturated liquid/vapour values
# cross-checked against dielectric-fluid boiling literature (e.g. Cardin/Bar-Cohen).
# NOTE: property values are a first-pass sourcing and should be reviewed against a
# primary reference before production use (see PR).

defaults:
  - base_fluid

name: Novec 649

T_sat_C: 49.0 # boiling point at 1 atm

rho_l: 1530.0 # kg/m^3  (saturated liquid)
rho_v: 13.4

mu_l: 4.5e-4 # Pa.s
mu_v: 1.1e-5

k_l: 0.054 # W/m/K
k_v: 0.012

cp_l: 1150.0 # J/kg/K
cp_v: 891.0

sigma: 1.08e-2 # N/m
h_lv: 88.0e3 # J/kg  (latent heat at the boiling point)

molar_mass: 0.316 # kg/mol (C6F12O; 3M datasheet)

# Wetting: perfectly wetting dielectric BY CLASS -- no published contact-angle
# or evaporating-angle measurement exists for Novec 649. The law below is
# FC-72's (Raj et al. 2012), transferred across the fluorinated-dielectric
# wetting class. Runs using it are labeled wetting_source: extrapolated.
theta_e_deg: 0.5 # class value; unmeasured for this fluid
theta_adv_deg: 0.5
theta_rec_deg: 0.0
theta_ev_coeff: 9.37 # FC-72's fit, class-extrapolated
theta_ev_exp: 0.54
wetting_source: extrapolated
