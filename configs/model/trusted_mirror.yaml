# The trusted architecture with mirror symmetry about the channel centreline
# built in (docs/plans/trustworthy-hidden-fields-plan.md, WP5): every field is
# exactly even about the axis (v exactly odd) and the capsule's centreline is
# pinned to it. For use once the physics has passed its acceptance tests
# without it; switched on earlier it would hide what the audit exists to show.

defaults:
  - trusted

mirror_symmetry: true
